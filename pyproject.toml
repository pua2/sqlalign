[project]
name = "sqlalign"
version = "1.2.0"
description = "A SQL formatter that cannot change what your SQL means"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pavan Amin" }]
keywords = ["sql", "formatter", "postgres", "redshift", "tsql", "plpgsql", "dbt"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: SQL",
    "Topic :: Database",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Text Processing :: Filters",
    "Typing :: Typed",
]

# The layout and safety engine reads exact sqlglot AST shapes -- cast
# discriminators, TimeUnit unit-casing, dollar-quote Heredoc bodies, and the
# quoting on identifiers. sqlglot moves these between releases, and the safety
# net cannot catch it: `ast_equal` compares output to input under the SAME
# sqlglot, so an upstream change moves both sides together.
#
# The range is 30.x rather than a single patch line because
# `tests/test_sqlglot_conformance.py` asserts each of those shapes by name, and
# CI runs the whole suite against the newest release the range allows as well as
# the locked one. Widen past 31 only with that suite green on the new major.
dependencies = [
    "sqlglot>=30.14,<31",
    # tomllib is stdlib from 3.11. tomli is the same API, and the marker keeps it
    # off every install that does not need it.
    "tomli>=2; python_version<'3.11'",
]

# sqlfluff is optional and imported only by --lint. sqlalign's own guarantee
# does not depend on a linter, so neither should its install.
[project.optional-dependencies]
lint = ["sqlfluff>=4.2,<5"]

[project.urls]
Homepage = "https://sqlalign.lumaru.app/"
Documentation = "https://sqlalign.lumaru.app/v1/"
Source = "https://github.com/pua2/sqlalign"
Issues = "https://github.com/pua2/sqlalign/issues"

[project.scripts]
sqlalign = "sqlalign.cli:console"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16.2",
    "sqlfluff>=4.3,<5",
    # Docs only. The site is GENERATED and committed, so nothing at runtime or
    # on GitHub Pages needs this --  is the only consumer.
    "markdown-it-py>=3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The sdist is an allowlist, not the working tree minus .gitignore. Hatchling's
# default reads only .gitignore -- not .git/info/exclude -- so anything ignored
# there, and any tracked-but-internal directory, ships in a build made from a
# working tree that carries one. Naming what goes IN cannot leak what happens
# to be lying around.
[tool.hatch.build.targets.sdist]
include = [
    # Anchored with a leading slash: an unanchored pattern matches at any
    # depth, which is how a root README pattern once dragged a sibling
    # directory's README back in.
    "/src", "/tests", "/tools", "/scripts", "/samples", "/.github",
    "/docs/guide", "/docs/v1", "/docs/index.html",
    "/README.md", "/CHANGELOG.md", "/CONTRIBUTING.md", "/LICENSE",
    "/.sqlfluff", "/.pre-commit-hooks.yaml", "/action.yml", "/uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"   # must track requires-python, or pyupgrade emits newer syntax

[tool.ruff.lint]
# E,F  pyflakes + pycodestyle errors   I  import order      UP  pyupgrade
# B    bugbear (real bug shapes)       C4 comprehensions    SIM simplification
# RUF  ruff-specific
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
# The docstrings are prose and deliberately use en/em dashes; RUF001-003 would
# have us mangle punctuation for no benefit.
ignore = ["RUF001", "RUF002", "RUF003"]
