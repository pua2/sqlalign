name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push supersedes the run in flight. Actions minutes are free for public
# repositories, but a queue of stale runs still delays the useful one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The versions pyproject claims to support. Both, because a classifier
        # nobody runs is a guess.
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

  # The formatter's own output is the product, so a golden that no longer
  # matches is a release blocker rather than a test failure among others. This
  # runs the same assertion the suite does, separately, so the reason a red
  # build is red is visible from the job list.
  goldens:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Goldens are byte-exact
        run: uv run pytest -q -k goldens_unchanged

  # `--lint` supports a RANGE of sqlfluff, but the matrix above only ever runs
  # the top of it. The rule names and config keys the coexistence config emits
  # are versioned surface, and `version_warning` is deliberately silent for a
  # sqlfluff older than the one the mappings were checked against -- so if the
  # floor broke, a user on it would get a wrong config and no warning at all.
  # Nothing but this job would notice.
  sqlfluff-floor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --all-extras

      # The oldest release the `lint` extra allows. Pinned exactly: "the floor"
      # is only meaningful if it is the floor that ran.
      - name: Install the oldest supported sqlfluff
        run: uv pip install 'sqlfluff==4.2.0'

      - name: The coexistence config still holds
        run: |
          uv run --no-sync python -c "import sqlfluff; print(sqlfluff.__version__)"
          uv run --no-sync pytest -q tests/test_sqlfluff_coexistence.py \
                                    tests/test_lint_flag.py \
                                    tests/test_bodylint.py

  # docs/v1 is generated and committed, so a stale build ships. Rebuilding here
  # proves the committed site matches its generator.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Site matches its generator
        run: uv run pytest -q tests/test_docs_site.py
